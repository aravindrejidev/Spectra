name: Build & release APK

# Manual only. Press "Run workflow" and type the version (e.g. 0.4.0).
# It builds a signed APK and publishes it as a GitHub Release, which the in-app updater reads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.4.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Version must look like 0.4.0"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spectra.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/spectra.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing: using a throw-away debug key, so this APK cannot update an installed copy."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon -PappVersionName="$VERSION" -PappVersionCode="${{ github.run_number }}"

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Spectra-v$VERSION.apk"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectra-apk
          path: Spectra-v${{ inputs.version }}.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Spectra v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          files: Spectra-v${{ inputs.version }}.apk
          make_latest: true
          fail_on_unmatched_files: true
